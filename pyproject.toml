[project]
name = "dopplerscrub"
version = "0.1.0"
description = "Privacy filter that finds and removes aircraft/vehicle Doppler tones from audio and video so recordings cannot be geolocated against ADS-B flight tracks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["doppler", "privacy", "audio", "ads-b", "anti-geolocation", "spectrogram"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[project.scripts]
dopplerscrub = "dopplerscrub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dopplerscrub"]

[dependency-groups]
dev = [
    "pytest>=8",
    "dopplertrack @ git+https://github.com/mjshiggins/dopplertrack",
]

[tool.pytest.ini_options]
markers = ["slow: long-running tests (real recordings, full datasets)"]
